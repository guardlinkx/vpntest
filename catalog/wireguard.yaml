protocol: wireguard
controls:
  - id: WG-01
    title: Silent to unauthenticated traffic
    requirement: Random or malformed UDP to the listen port draws no response.
    baselines: ["WireGuard protocol paper"]
    severity: medium
    remediation: WireGuard is silent by design; investigate any responder in front of it.
  - id: WG-02
    title: Private keys readable only by the service
    requirement: Key and config files are owner-only.
    baselines: ["Org policy"]
    severity: critical
    remediation: chmod 600 the private key and wg0.conf; chown to the service user.
  - id: WG-03
    title: Unique key pair per peer
    requirement: No public key appears twice in the peer inventory.
    baselines: ["Org policy"]
    severity: high
    remediation: Reissue duplicated peers with fresh key pairs.
  - id: WG-04
    title: Pre-shared key on each peer
    requirement: Every peer carries a PresharedKey, for post-quantum resistance.
    baselines: ["WireGuard protocol paper"]
    severity: medium
    remediation: Add a unique PresharedKey per peer during provisioning.
  - id: WG-05
    title: Least-privilege AllowedIPs on the gateway
    requirement: Server-side peers are limited to their own address, not 0.0.0.0/0.
    baselines: ["Org policy"]
    severity: critical
    remediation: Set each server-side peer AllowedIPs to its /32 (or /128).
  - id: WG-06
    title: Keys rotated within policy
    requirement: No key older than the policy limit.
    baselines: ["Org policy"]
    severity: low
    remediation: Rotate peer keys on the policy interval.
  - id: WG-07
    title: Removed peers cannot connect
    requirement: A decommissioned key completes no handshake.
    baselines: ["Org policy"]
    severity: high
    remediation: Remove peers from the live interface, not only the config file.
  - id: WG-08
    title: Host firewall exposes only the WireGuard port
    requirement: A single UDP listener on the public interface.
    baselines: ["DISA VPN SRG"]
    severity: high
    remediation: Restrict inbound to the WireGuard UDP port.
  - id: WG-09
    title: Implementation version current
    requirement: Not a version named in vendor advisories.
    baselines: ["Vendor advisories"]
    severity: high
    remediation: Update the kernel module or userspace implementation.
  - id: WG-10
    title: FIPS applicability flagged
    requirement: Report non-compliance where FIPS 140-3 is mandatory.
    baselines: ["FIPS 140-3"]
    severity: info
    notes: >
      WireGuard's primitives (X25519, ChaCha20-Poly1305) are not FIPS 140-3
      approved. This control records the fact rather than treating it as a
      defect — it is only a failure where FIPS is contractually required.
    remediation: Use an IPsec/FIPS-validated path where FIPS is mandatory.
  - id: WG-11
    title: Stale peers reaped
    requirement: The peer count tracks live users, not everyone who ever connected.
    baselines: ["Org policy"]
    severity: medium
    notes: >
      Unbounded peer growth is both a capacity problem and a security one: a
      key that was issued once keeps working forever if nothing removes it.
    remediation: Expire peers that have not handshaked within the policy window.
